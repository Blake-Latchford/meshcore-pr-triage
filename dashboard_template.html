<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage &mdash; __REPO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F2F4F1;
    --panel: #FFFFFF;
    --panel-2: #EBEFEA;
    --border: #DCE2DB;
    --ink: #1A2420;
    --ink-soft: #59645D;
    --ink-faint: #8B958F;
    --accent: #24708F;
    --accent-ink: #FFFFFF;
    --good: #2E8B57;
    --warn: #B8842A;
    --bad: #C1442D;
    --row-hover: #E7EFEC;
    --shadow: 0 1px 2px rgba(20, 30, 26, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161A; --panel: #172025; --panel-2: #1D272C; --border: #2A363B;
      --ink: #E7EEEA; --ink-soft: #8FA29A; --ink-faint: #5E7169;
      --accent: #5FB4D6; --accent-ink: #08181D;
      --good: #4FC488; --warn: #E3A94D; --bad: #E2694E;
      --row-hover: #1C2A2C; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161A; --panel: #172025; --panel-2: #1D272C; --border: #2A363B;
    --ink: #E7EEEA; --ink-soft: #8FA29A; --ink-faint: #5E7169;
    --accent: #5FB4D6; --accent-ink: #08181D;
    --good: #4FC488; --warn: #E3A94D; --bad: #E2694E;
    --row-hover: #1C2A2C; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 24px clamp(16px, 4vw, 32px) 60px;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }

  header.page { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
  h1 {
    font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance;
  }
  h1 .repo { color: var(--accent); }
  .meta { color: var(--ink-soft); font-size: 12.5px; }
  .meta .mono { color: var(--ink-faint); }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-top: 3px solid var(--stat-c, var(--border));
    border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow);
  }
  .stat .n { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .stat .l { color: var(--ink-soft); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  }
  input[type=search], select {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; font: 13px "IBM Plex Sans", sans-serif;
  }
  input[type=search]:focus, select:focus, th:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  input[type=search] { flex: 1 1 220px; min-width: 140px; }
  select { cursor: pointer; }

  .tablewrap {
    overflow-x: auto; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); box-shadow: var(--shadow);
  }
  table { border-collapse: collapse; width: 100%; min-width: 860px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th {
    cursor: pointer; user-select: none; color: var(--ink-soft); font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
    position: sticky; top: 0; background: var(--panel-2); z-index: 1;
  }
  th:hover { color: var(--ink); }
  th[aria-sort]::after { content: ' \2193'; opacity: .5; }
  th[aria-sort="ascending"]::after { content: ' \2191'; opacity: .8; }
  th[aria-sort="descending"]::after { content: ' \2193'; opacity: .8; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: var(--row-hover); }
  tbody tr.row.draft { opacity: .5; }
  tbody tr.row.expanded { background: var(--row-hover); }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .title-cell { max-width: 360px; }
  .title-cell a { color: var(--ink); font-weight: 500; }
  .title-cell a:hover { color: var(--accent); }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 600;
    letter-spacing: .02em; white-space: nowrap;
  }
  .b-good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .b-bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .b-warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .b-muted { background: color-mix(in srgb, var(--ink-faint) 20%, transparent); color: var(--ink-soft); }

  /* Score as a signal meter, echoing the RSSI bars on the radios this repo ships firmware for */
  .meter-cell { display: flex; align-items: center; gap: 8px; }
  .meter-num { width: 34px; text-align: right; font-weight: 600; font-size: 13px; }
  .meter-num.neg { color: var(--bad); }
  .meter-num.pos { color: var(--good); }
  .meter {
    position: relative; width: 64px; height: 12px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 3px; overflow: hidden; flex: none;
  }
  .meter::before {
    content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border);
  }
  .meter .fill { position: absolute; top: 1px; bottom: 1px; border-radius: 2px; }
  .meter .fill.pos { left: 50%; background: var(--good); }
  .meter .fill.neg { right: 50%; background: var(--bad); }

  .num-cell { font-size: 13px; }
  .subtle { color: var(--ink-faint); font-size: 11.5px; }

  .detail-row td { background: var(--panel-2); cursor: default; padding: 0; }
  .detail { padding: 14px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 640px) { .detail { grid-template-columns: 1fr; } }
  .detail h4 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft);
  }
  .detail ul { margin: 0; padding-left: 18px; }
  .detail li { margin-bottom: 6px; line-height: 1.45; }
  .detail li:last-child { margin-bottom: 0; }
  .empty { color: var(--ink-faint); font-style: italic; font-size: 13px; }
  [hidden] { display: none !important; }

  .tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    padding: 8px 14px; color: var(--ink-soft); font: 600 13px "IBM Plex Sans", sans-serif; cursor: pointer;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tabs .count { color: var(--ink-faint); font-weight: 500; margin-left: 4px; }
</style>
</head>
<body>

<header class="page">
  <h1>Triage &mdash; <span class="repo">__REPO__</span></h1>
  <div class="meta">Generated <span class="mono">__GENERATED__</span> &middot; <span class="mono">__COUNT__</span> open PRs, <span class="mono">__ISSUE_COUNT__</span> open issues analyzed</div>
</header>

<div class="tabs" role="tablist" id="tabs"></div>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <input type="search" id="search" placeholder="Search title, author, or #&hellip;">
  <span id="filters" style="display:contents"></span>
</div>

<div class="tablewrap">
<table id="tbl">
  <thead><tr id="thead"></tr></thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<script>
const DATA = __DATA__;
const SCORE_SCALE = 100; // score magnitude that fills half the meter

function badge(text, cls) { return `<span class="badge ${cls}">${text}</span>`; }
function ciBadge(v) {
  return { PASSING: badge('passing', 'b-good'), FAILING: badge('failing', 'b-bad'),
    PENDING: badge('pending', 'b-warn'), NONE: badge('none', 'b-muted') }[v] || v;
}
function mergeBadge(v) {
  return { MERGEABLE: badge('clean', 'b-good'), CONFLICTING: badge('conflict', 'b-bad'),
    UNKNOWN: badge('unknown', 'b-muted') }[v] || v;
}
function reviewBadge(v) {
  return { APPROVED: badge('approved', 'b-good'), CHANGES_REQUESTED: badge('changes req.', 'b-bad'),
    REVIEW_REQUIRED: badge('required', 'b-warn'), NONE: badge('none', 'b-muted') }[v] || v;
}
function kindBadge(v) {
  return { BUG: badge('bug', 'b-bad'), FEATURE: badge('feature', 'b-good'), HARDWARE: badge('hardware', 'b-warn'),
    QUESTION: badge('question', 'b-muted'), OTHER: badge('other', 'b-muted') }[v] || v;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function prLink(n) { return `<a href="https://github.com/__REPO__/pull/${n}" target="_blank" rel="noopener">#${n}</a>`; }

function meter(score) {
  const pct = Math.max(-100, Math.min(100, (score / SCORE_SCALE) * 100)) / 2; // half-track max
  const fillClass = score >= 0 ? 'pos' : 'neg';
  const numClass = score >= 0 ? 'pos' : 'neg';
  return `
    <div class="meter-cell">
      <span class="meter-num mono ${numClass}">${score}</span>
      <span class="meter" title="Priority ${score}">
        <span class="fill ${fillClass}" style="width:${Math.abs(pct)}%"></span>
      </span>
    </div>`;
}
function titleCell(r, extraBadges) {
  return `<td class="title-cell"><a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)}</a>${extraBadges}</td>`;
}
const num = v => `<td class="mono num-cell">${v}</td>`;
const flags = list => `<td class="subtle">${list.length ? list.length + ' &#9888;' : '&ndash;'}</td>`;

// Each view: columns (key = sort field, null = unsortable), select filters
// (built from the values present unless options are given), stat tiles, and
// the two lists shown when a row is expanded.
const VIEWS = {
  prs: {
    label: 'Pull requests', noun: 'PRs', scoreKey: 'reviewerScore',
    rowClass: r => r.isDraft ? 'draft' : '',
    columns: [
      ['#', 'number', r => num(r.number)],
      ['Title', 'title', r => titleCell(r, (r.isDraft ? ' ' + badge('draft', 'b-muted') : '')
        + (r.suspiciousAgentMarker ? ' ' + badge('&#9888; agent-marker', 'b-warn') : ''))],
      ['Author', 'author', r => `<td>${esc(r.author)}</td>`],
      ['Merged', 'authorMergedPRs', r => num(r.authorMergedPRs ?? '?')],
      ['Priority', 'reviewerScore', r => `<td>${meter(r.reviewerScore)}</td>`],
      ['CI', 'ci', r => `<td>${ciBadge(r.ci)}</td>`],
      ['Merge', 'mergeable', r => `<td>${mergeBadge(r.mergeable)}</td>`],
      ['Review', 'reviewDecision', r => `<td>${reviewBadge(r.reviewDecision)}</td>`],
      ['Diff', 'diffLines', r => `<td class="mono num-cell">${r.diffLines}<span class="subtle">/${r.filesChanged}f</span></td>`],
      ['Age (d)', 'ageDays', r => num(r.ageDays)],
      ['Idle (d)', 'idleDays', r => num(r.idleDays)],
      ['Flags', null, r => flags(r.submitterFeedback)],
    ],
    filters: [
      { label: 'CI', test: (r, v) => r.ci === v, values: 'ci' },
      { label: 'Merge', test: (r, v) => r.mergeable === v, values: 'mergeable' },
      { label: 'Review', test: (r, v) => r.reviewDecision === v, values: 'reviewDecision' },
      { label: 'Drafts', anyLabel: 'include', options: [['hide', 'hide'], ['only', 'only']],
        test: (r, v) => v === 'hide' ? !r.isDraft : r.isDraft },
    ],
    stats: rows => [
      ['Open PRs', rows.length, null],
      ['Drafts', rows.filter(r => r.isDraft).length, null],
      ['CI failing', rows.filter(r => r.ci === 'FAILING').length, 'bad'],
      ['Conflicts', rows.filter(r => r.mergeable === 'CONFLICTING').length, 'bad'],
      ['Empty/short desc.', rows.filter(r => r.descriptionState !== 'OK').length, 'warn'],
      ['First-time authors', rows.filter(r => r.authorMergedPRs === 0).length, null],
      ['Long description', rows.filter(r => r.descriptionLength > 1500).length, 'warn'],
      ['Approved, unmerged', rows.filter(r => r.reviewDecision === 'APPROVED').length, 'good'],
      ['Likely abandoned', rows.filter(r => r.idleDays > 21 && r.reviewDecision === 'CHANGES_REQUESTED').length, 'warn'],
    ],
    detail: r => [
      ['Feedback for submitter', r.submitterFeedback, 'No issues flagged.'],
      ['Why a reviewer might pick this up', r.reviewerReasons, 'No standout signals.'],
    ],
  },
  issues: {
    label: 'Issues', noun: 'issues', scoreKey: 'priorityScore',
    rowClass: r => r.isStale ? 'draft' : '',
    columns: [
      ['#', 'number', r => num(r.number)],
      ['Title', 'title', r => titleCell(r, r.isStale
        ? ' ' + badge(r.closesInDays ? `stale &middot; ${r.closesInDays}d` : "stale &middot; overdue", r.participants + r.reactionCount >= 3 ? 'b-warn' : 'b-muted') : '')],
      ['Author', 'author', r => `<td>${esc(r.author)}</td>`],
      ['Priority', 'priorityScore', r => `<td>${meter(r.priorityScore)}</td>`],
      ['Kind', 'kind', r => `<td>${kindBadge(r.kind)}</td>`],
      ['People', 'participants', r => num(r.participants)],
      ['Reactions', 'reactionCount', r => num(r.reactionCount)],
      ['Open PRs', 'linkedPRCount', r => `<td class="mono num-cell">${r.linkedPRs.length ? r.linkedPRs.map(prLink).join(' ') : '<span class="subtle">&ndash;</span>'}</td>`],
      ['Age (d)', 'ageDays', r => num(r.ageDays)],
      ['Idle (d)', 'idleDays', r => num(r.idleDays)],
      ['Flags', null, r => flags(r.reporterFeedback)],
    ],
    filters: [
      { label: 'Kind', test: (r, v) => r.kind === v, values: 'kind' },
      { label: 'Stale', anyLabel: 'include', options: [['hide', 'hide'], ['only', 'only']],
        test: (r, v) => v === 'hide' ? !r.isStale : r.isStale },
      { label: 'Open PR', anyLabel: 'any', options: [['yes', 'has one'], ['no', 'none']],
        test: (r, v) => (r.linkedPRs.length > 0) === (v === 'yes') },
      { label: 'Response', anyLabel: 'any', options: [['none', 'never answered'], ['some', 'answered']],
        test: (r, v) => (r.participants === 0) === (v === 'none') },
    ],
    stats: rows => [
      ['Open issues', rows.length, null],
      ['Never answered', rows.filter(r => r.participants === 0 && r.ageDays > 3).length, 'warn'],
      ['Stale (auto-closing)', rows.filter(r => r.isStale).length, 'bad'],
      ['Stale but wanted', rows.filter(r => r.isStale && r.participants + r.reactionCount >= 3).length, 'warn'],
      ['Fix pending in PR', rows.filter(r => r.linkedPRs.length).length, 'good'],
      ['Bugs missing details', rows.filter(r => r.missingDetails.length).length, 'warn'],
      ['On old firmware', rows.filter(r => r.firmwareOutdated).length, 'warn'],
      ['Confirmed by others', rows.filter(r => r.confirmations > 0).length, 'good'],
    ],
    detail: r => [
      ['Feedback for reporter', r.reporterFeedback, 'No issues flagged.'],
      ['Why a maintainer might pick this up', r.maintainerReasons, 'No standout signals.'],
    ],
  },
};
for (const r of DATA.issues) r.linkedPRCount = r.linkedPRs.length;

let view = 'prs';
let sortKey, sortDir, expanded;

function buildTabs() {
  document.getElementById('tabs').innerHTML = Object.entries(VIEWS).map(([id, v]) =>
    `<button role="tab" data-view="${id}" aria-selected="${id === view}">${v.label}<span class="count mono">${DATA[id].length}</span></button>`
  ).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
}

function switchView(id) {
  view = id;
  const v = VIEWS[id];
  sortKey = v.scoreKey; sortDir = -1; expanded = null;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === id));
  document.getElementById('search').value = '';

  document.getElementById('filters').innerHTML = v.filters.map((f, i) => {
    const opts = f.options || [...new Set(DATA[id].map(d => d[f.values]))].sort().map(x => [x, x]);
    return `<select data-filter="${i}"><option value="">${f.label}: ${f.anyLabel || 'any'}</option>${
      opts.map(([val, text]) => `<option value="${esc(val)}">${f.label}: ${esc(text)}</option>`).join('')}</select>`;
  }).join('');
  document.querySelectorAll('#filters select').forEach(s => s.addEventListener('input', render));

  document.getElementById('thead').innerHTML = v.columns.map(([label, key]) =>
    `<th${key ? ` data-key="${key}" tabindex="0"` : ''}${key === sortKey ? ' aria-sort="descending"' : ''}>${label}</th>`).join('');
  document.querySelectorAll('th[data-key]').forEach(th => {
    const sortBy = () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = key === 'title' || key === 'author' ? 1 : -1; }
      document.querySelectorAll('th[data-key]').forEach(t => t.removeAttribute('aria-sort'));
      th.setAttribute('aria-sort', sortDir === 1 ? 'ascending' : 'descending');
      render();
    };
    th.addEventListener('click', sortBy);
    th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(); } });
  });

  document.getElementById('stats').innerHTML = v.stats(DATA[id]).map(([l, n, sem]) =>
    `<div class="stat" style="${sem ? `--stat-c: var(--${sem})` : ''}">
      <div class="n mono">${n}</div><div class="l">${l}</div>
    </div>`).join('');
  render();
}

function currentRows() {
  const v = VIEWS[view];
  const q = document.getElementById('search').value.toLowerCase();
  const active = [...document.querySelectorAll('#filters select')]
    .filter(s => s.value).map(s => [v.filters[s.dataset.filter], s.value]);
  const rows = DATA[view].filter(r => {
    if (q && !(`${r.number} ${r.title} ${r.author}`.toLowerCase().includes(q))) return false;
    return active.every(([f, val]) => f.test(r, val));
  });
  rows.sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });
  return rows;
}

function render() {
  const v = VIEWS[view];
  const rows = currentRows();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.className = ['row', v.rowClass(r), expanded === r.number ? 'expanded' : ''].join(' ');
    tr.innerHTML = v.columns.map(([, , cell]) => cell(r)).join('');
    tr.addEventListener('click', e => {
      if (e.target.closest('a')) return; // let links open without toggling the row
      expanded = expanded === r.number ? null : r.number;
      render();
    });
    tbody.appendChild(tr);
    if (expanded === r.number) {
      const dr = document.createElement('tr');
      dr.className = 'detail-row';
      const td = document.createElement('td');
      td.colSpan = v.columns.length;
      td.innerHTML = `<div class="detail">${v.detail(r).map(([heading, items, empty]) =>
        `<div><h4>${heading}</h4>${items.length
          ? `<ul>${items.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`
          : `<div class="empty">${empty}</div>`}</div>`).join('')}</div>`;
      dr.appendChild(td);
      tbody.appendChild(dr);
    }
  }
}

document.getElementById('search').addEventListener('input', render);
buildTabs();
switchView(location.hash === '#issues' && DATA.issues.length ? 'issues' : 'prs');
</script>
</body>
</html>
